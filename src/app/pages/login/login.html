<div class="relative flex min-h-screen flex-col overflow-hidden bg-slate-50 font-sans text-slate-800">
  <div class="absolute bottom-0 left-0 z-0 h-64 w-full origin-bottom-left -skew-y-6 transform bg-slate-100"></div>
  <div class="absolute bottom-0 right-0 z-0 h-80 w-1/2 origin-bottom-right skew-y-12 transform bg-slate-200 opacity-40"></div>

  <main class="z-10 flex flex-grow items-center justify-center p-4">
    <div class="w-full max-w-[420px] overflow-hidden rounded-xl border border-slate-200 bg-white shadow-lg">
      <div class="border-b border-slate-100 px-8 pb-6 pt-10 text-center">
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-slate-900 shadow-sm">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
            <path d="m8 3 4 8 5-5 5 15H2L8 3z" />
          </svg>
        </div>
        <h2 class="text-xl font-bold text-slate-900">Grupo Cordillera</h2>
        <p class="mt-1 text-sm text-slate-500">Management Portal</p>
      </div>

      <div class="space-y-5 p-8">
        <p class="text-center text-sm text-slate-500">
          Accedé con tu cuenta Microsoft corporativa para continuar.
        </p>
        <button
          type="button"
          (click)="authService.login()"
          class="flex w-full items-center justify-center gap-2 rounded-lg bg-slate-900 py-2.5 text-sm font-medium text-white transition-colors hover:bg-slate-800"
        >
          Iniciar sesión con Microsoft
        </button>
      </div>

      <div class="border-t border-slate-100 px-8 pb-8 pt-5 text-center">
        <p class="text-xs text-slate-500">¿Necesitás ayuda con el portal?</p>
        <a href="mailto:soporte@grupocordillera.com" class="mt-2 flex items-center justify-center gap-1.5 text-sm font-medium text-slate-700 hover:text-slate-900">
          Contactar a Soporte IT
        </a>
      </div>
    </div>
  </main>

  <footer class="z-10 grid w-full grid-cols-1 items-center gap-4 px-6 py-5 text-xs text-slate-500 md:grid-cols-3 md:px-12">
    <div class="text-center md:text-left">© 2026 Grupo Cordillera. Todos los derechos reservados.</div>

    <div class="flex items-center justify-center gap-4 text-slate-400 md:justify-self-center">
      <span class="flex h-6 w-6 items-center justify-center" title="Angular">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-label="Angular">
          <path d="M12 2 2 5.5l1.5 13L12 23l8.5-4.5 1.5-13L12 2Zm0 2.2 7.4 2.6-1.2 10.5L12 20.6l-6.2-3.3-1.2-10.5L12 4.2Zm0 2.7L7.4 17.3h1.8l.9-2.3h4l.9 2.3h1.8L12 6.9Zm0 3.6 1.3 3.3h-2.6L12 10.5Z"/>
        </svg>
      </span>
      <span class="flex h-6 w-6 items-center justify-center" title="Spring Boot">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-label="Spring Boot">
          <path d="M12 2C7 2 3 6 3 11c0 3 1.5 5.5 3.8 7.1-.3-1-.4-2.3 0-3.4.6-1.7 2-3 3.9-3.7-1.7 1.7-2.3 3.9-1.6 5.9.4 1.2 1.3 2.1 2.4 2.6.4-.9.7-2 .5-3.2C15.6 17.8 17 15.5 17 13c0-1.6-.6-3-1.6-4.1C18 9.8 20 12.5 20 15.5c0 2-1 3.8-2.5 5C19.6 19 21 15.7 21 12c0-5.5-4-10-9-10Z"/>
        </svg>
      </span>
      <span class="flex h-6 w-6 items-center justify-center" title="PostgreSQL">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="PostgreSQL">
          <ellipse cx="12" cy="5" rx="8" ry="3"/>
          <path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/>
          <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
        </svg>
      </span>
      <span class="flex h-6 w-6 items-center justify-center" title="Docker">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Docker">
          <rect x="3" y="10" width="4" height="4"/>
          <rect x="8" y="10" width="4" height="4"/>
          <rect x="13" y="10" width="4" height="4"/>
          <rect x="8" y="5" width="4" height="4"/>
          <path d="M2 14c0 4 3 7 8 7 6 0 10-3 11-8h1c1 0 1-3 0-3-1-1-3 0-3 0"/>
        </svg>
      </span>
      <span class="flex h-6 w-6 items-center justify-center" title="Microsoft Azure">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-label="Microsoft Azure">
          <path d="M10.5 3h4L8 21H2.5L10.5 3Z"/>
          <path d="M14.8 3.6 9.3 17.2l-1.8 3.8h14L15.6 9.8l2.2-3.1-3-3.1Z"/>
        </svg>
      </span>
      <span class="flex h-6 w-6 items-center justify-center" title="Microsoft Entra ID">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Microsoft Entra ID">
          <path d="M6 18a4 4 0 0 1-.5-7.97A5 5 0 0 1 15 8a4.5 4.5 0 0 1 1 8.9"/>
          <path d="M6 18h11"/>
        </svg>
      </span>
    </div>

    <div class="flex items-center justify-center gap-1.5 font-medium text-slate-700 md:justify-self-end">
      <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
      Sistemas Operativos
    </div>
  </footer>
</div>
